<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corespace - Student Portal & Academia Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-purple: #818cf8;
      --accent-pink: #c084fc;
      --accent-cyan: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --card-bg: rgba(15, 23, 42, 0.6);
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient background blur blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }
    .blob-1 {
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: rgba(99, 102, 241, 0.25);
    }
    .blob-2 {
      bottom: -100px;
      right: -100px;
      width: 450px;
      height: 450px;
      background: rgba(192, 132, 252, 0.2);
    }

    .container {
      width: 100%;
      max-width: 1100px;
      z-index: 1;
      margin-top: 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(129, 140, 248, 0.4);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    /* Auth Card */
    .auth-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 36px;
      max-width: 460px;
      margin: 40px auto;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
    }

    .captcha-container {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      margin-bottom: 12px;
      min-height: 56px;
      justify-content: space-between;
    }

    .captcha-img {
      height: 40px;
      border-radius: 6px;
      object-fit: contain;
    }

    .refresh-btn {
      background: transparent;
      border: none;
      color: var(--accent-purple);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(129, 140, 248, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(129, 140, 248, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(129, 140, 248, 0.5);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Dashboard Layout */
    .dashboard {
      display: none;
      flex-direction: column;
      gap: 24px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      overflow-x: auto;
    }

    .tab-btn {
      padding: 10px 20px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: rgba(129, 140, 248, 0.2);
      color: #fff;
      border: 1px solid rgba(129, 140, 248, 0.4);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards & Grids */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }

    .profile-info h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
    }

    .profile-info p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .info-item {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
    }

    .info-item .label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-item .value {
      font-size: 15px;
      font-weight: 600;
    }

    /* Attendance List */
    .attendance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .att-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
    }

    .att-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .att-code {
      font-weight: 700;
      font-size: 14px;
      color: var(--accent-cyan);
    }

    .att-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .att-percent {
      font-size: 22px;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
    }

    .att-percent.good { color: var(--success); }
    .att-percent.warning { color: var(--warning); }
    .att-percent.danger { color: var(--danger); }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .progress-bar-fill.good { background: var(--success); }
    .progress-bar-fill.warning { background: var(--warning); }
    .progress-bar-fill.danger { background: var(--danger); }

    .att-stats {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Error Message */
    .alert-error {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: var(--danger);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-icon">C</div>
        <div class="brand-title">Corespace</div>
      </div>
      <div class="server-status">
        <div class="status-dot"></div>
        <span>Live API Connected</span>
      </div>
    </header>

    <!-- Login View -->
    <div id="loginView">
      <div class="auth-card">
        <h1 class="auth-title">Student Login</h1>
        <p class="auth-subtitle">Access Attendance, Timetable & Internal Marks</p>

        <div id="errorAlert" class="alert-error"></div>

        <form id="loginForm">
          <div class="form-group">
            <label>Register Number / NetID</label>
            <input type="text" id="netIdInput" class="form-input" placeholder="e.g. RA2111003010xxx" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" class="form-input" placeholder="Enter portal password" required>
          </div>

          <div class="form-group">
            <label>Captcha</label>
            <div class="captcha-container">
              <img id="captchaImg" class="captcha-img" src="" alt="Loading Captcha...">
              <button type="button" id="refreshCaptchaBtn" class="refresh-btn">🔄 Refresh</button>
            </div>
            <input type="text" id="captchaInput" class="form-input" placeholder="Enter captcha characters" required autocomplete="off">
          </div>

          <button type="submit" id="submitBtn" class="btn-submit">
            <span id="submitBtnText">Login & Fetch Data</span>
            <div id="submitSpinner" class="spinner" style="display: none;"></div>
          </button>
        </form>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="dashboard">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('profileTab')">👤 Profile</button>
        <button class="tab-btn" onclick="switchTab('attendanceTab')">📊 Attendance</button>
        <button class="tab-btn" onclick="switchTab('timetableTab')">📅 Timetable</button>
        <button class="tab-btn" onclick="switchTab('marksTab')">📝 Internal Marks</button>
        <button class="tab-btn" onclick="logout()">🚪 Logout</button>
      </div>

      <!-- Profile Tab -->
      <div id="profileTab" class="tab-content active">
        <div class="card">
          <div class="profile-header">
            <div class="avatar" id="profAvatar">S</div>
            <div class="profile-info">
              <h2 id="profName">Student Name</h2>
              <p id="profRegNo">Register No</p>
            </div>
          </div>
          <div class="info-grid" id="profGrid"></div>
        </div>
      </div>

      <!-- Attendance Tab -->
      <div id="attendanceTab" class="tab-content">
        <div class="attendance-grid" id="attGrid"></div>
      </div>

      <!-- Timetable Tab -->
      <div id="timetableTab" class="tab-content">
        <div class="card" id="timetableCard">
          <p class="text-muted">Loading timetable...</p>
        </div>
      </div>

      <!-- Marks Tab -->
      <div id="marksTab" class="tab-content">
        <div class="card" id="marksCard">
          <p class="text-muted">Loading internal marks...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let sessionId = null;

    // Load captcha on page load
    async function loadCaptcha() {
      const captchaImg = document.getElementById('captchaImg');
      const refreshBtn = document.getElementById('refreshCaptchaBtn');
      refreshBtn.disabled = true;
      captchaImg.alt = "Loading captcha...";
      
      try {
        const res = await fetch(`${API_BASE}/api/captcha`);
        const data = await res.json();
        if (data.success && data.captcha_image) {
          captchaImg.src = data.captcha_image;
          sessionId = data.session_id;
        } else {
          showError("Failed to load captcha image. Please try again.");
        }
      } catch (err) {
        showError("Network error loading captcha.");
      } finally {
        refreshBtn.disabled = false;
      }
    }

    document.getElementById('refreshCaptchaBtn').addEventListener('click', loadCaptcha);

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const netId = document.getElementById('netIdInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const captcha = document.getElementById('captchaInput').value.trim();

      if (!netId || !password || !captcha) {
        showError("Please fill in all fields.");
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(`${API_BASE}/api/fetch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            portal_netid: netId,
            portal_password: password,
            portal_captcha: captcha,
            session_id: sessionId
          })
        });

        const data = await res.json();

        if (res.status === 200 && data.success) {
          renderDashboard(data);
        } else {
          const msg = data.detail?.message || data.detail || "Login failed. Check your credentials and captcha.";
          showError(msg);
          loadCaptcha(); // Reload captcha on failure
        }
      } catch (err) {
        showError("Server error during login. Please try again.");
        loadCaptcha();
      } finally {
        setLoading(false);
      }
    });

    function renderDashboard(data) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'flex';

      // Profile
      const prof = data.profile || {};
      document.getElementById('profName').innerText = prof.name || "Student";
      document.getElementById('profRegNo').innerText = prof.regNo || "N/A";
      document.getElementById('profAvatar').innerText = (prof.name || "S")[0].toUpperCase();

      const profGrid = document.getElementById('profGrid');
      profGrid.innerHTML = `
        <div class="info-item"><div class="label">Register No</div><div class="value">${prof.regNo || 'N/A'}</div></div>
        <div class="info-item"><div class="label">Department</div><div class="value">${prof.dept || 'N/A'}</div></div>
        <div class="info-item"><div class="label">Batch</div><div class="value">${prof.batch || 'N/A'}</div></div>
        <div class="info-item"><div class="label">Semester</div><div class="value">${prof.semester || 'N/A'}</div></div>
        <div class="info-item"><div class="label">Section</div><div class="value">${prof.section || 'N/A'}</div></div>
        <div class="info-item"><div class="label">Program</div><div class="value">${prof.program || 'N/A'}</div></div>
      `;

      // Attendance
      const attGrid = document.getElementById('attGrid');
      attGrid.innerHTML = '';
      (data.attendance || []).forEach(item => {
        const pct = item.percent || 0;
        const statusClass = pct >= 75 ? 'good' : pct >= 65 ? 'warning' : 'danger';
        attGrid.innerHTML += `
          <div class="att-card">
            <div class="att-header">
              <span class="att-code">${item.code}</span>
              <span class="att-percent ${statusClass}">${pct}%</span>
            </div>
            <div class="att-title">${item.title}</div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill ${statusClass}" style="width: ${Math.min(100, pct)}%"></div>
            </div>
            <div class="att-stats">
              <span>Present: ${item.present}</span>
              <span>Conducted: ${item.conducted}</span>
              <span>Absent: ${item.absent}</span>
            </div>
          </div>
        `;
      });

      // Timetable
      const ttCard = document.getElementById('timetableCard');
      const tt = data.timetable?.portal || {};
      if (Object.keys(tt).length === 0) {
        ttCard.innerHTML = '<p style="color:var(--text-muted)">No timetable data found.</p>';
      } else {
        let html = '';
        for (const [day, slots] of Object.entries(tt)) {
          html += `<h3 style="margin: 16px 0 8px 0; color: var(--accent-purple);">${day}</h3><div class="info-grid">`;
          for (const [time, details] of Object.entries(slots)) {
            html += `
              <div class="info-item">
                <div class="label">${time}</div>
                <div class="value">${details.name || details.code}</div>
                <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">📍 ${details.room} | 👨‍🏫 ${details.faculty}</div>
              </div>
            `;
          }
          html += `</div>`;
        }
        ttCard.innerHTML = html;
      }

      // Marks
      const marksCard = document.getElementById('marksCard');
      const marks = data.marks || [];
      if (marks.length === 0) {
        marksCard.innerHTML = '<p style="color:var(--text-muted)">No internal marks available.</p>';
      } else {
        let html = '<div class="info-grid">';
        marks.forEach(m => {
          html += `
            <div class="info-item">
              <div class="label">${m.courseCode}</div>
              <div class="value">${m.title}</div>
              <div style="font-size: 16px; font-weight: 700; color: var(--accent-cyan); margin-top: 6px;">Score: ${m.performance}</div>
            </div>
          `;
        });
        html += '</div>';
        marksCard.innerHTML = html;
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function logout() {
      document.getElementById('dashboardView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('captchaInput').value = '';
      loadCaptcha();
    }

    function showError(msg) {
      const el = document.getElementById('errorAlert');
      el.innerText = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorAlert').style.display = 'none';
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('submitBtnText');
      const spinner = document.getElementById('submitSpinner');
      btn.disabled = isLoading;
      text.style.display = isLoading ? 'none' : 'inline';
      spinner.style.display = isLoading ? 'block' : 'none';
    }

    // Initialize on load
    loadCaptcha();
  </script>
</body>
</html>
